spring:
  application:
    name: backend
  profiles:
    default: supabase
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://placeholder-pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SUPABASE_DB_USERNAME:placeholder}
    password: ${SUPABASE_DB_PASSWORD:placeholder}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  supabase:
    url: ${SUPABASE_URL:https://placeholder.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:placeholder}
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:placeholder}
  ngo:
    form-new-url: ${NGO_FORM_NEW_URL:placeholder}
    form-existing-url: ${NGO_FORM_EXISTING_URL:placeholder}
    form-reschedule-url: ${NGO_FORM_RESCHEDULE_URL:placeholder}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000} 
logging:
  level:
    org.springframework.security: DEBUG  