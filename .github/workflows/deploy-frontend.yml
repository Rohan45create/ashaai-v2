# ==============================================================================
# AshaAI - Deploy Frontend (React / Vite) to Azure Static Web Apps
#
# Required GitHub Secrets:
# - AZURE_STATIC_WEB_APPS_API_TOKEN: Deployment token from Azure Static Web App
#     Overview -> "Manage deployment token", or via CLI.
# - VITE_BACKEND_URL (or BACKEND_API_URL): Full base URL of the deployed Spring Boot backend
#     (e.g. https://ashaai-back-exeja6c4gadqgefj.centralindia-01.azurewebsites.net).
#     Injected at build time into Vite so the SPA reaches /api endpoints and public-config.
#
# Note: Supabase and Google Maps keys are fetched dynamically at runtime by the
# frontend from Spring Boot's /api/public-config endpoint.
# ==============================================================================

name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend with Vite
        working-directory: frontend
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || secrets.BACKEND_API_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_BACKEND_URL || secrets.BACKEND_API_URL }}
        run: |
          echo "=== Checking build-time backend URL environment ==="
          if [ -z "$VITE_BACKEND_URL" ]; then
            echo "::error::Neither VITE_BACKEND_URL nor BACKEND_API_URL secret is set in GitHub Secrets! Please add VITE_BACKEND_URL under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [[ "$VITE_BACKEND_URL" != http* ]]; then
            echo "VITE_BACKEND_URL is missing http(s) scheme, prepending https://"
            export VITE_BACKEND_URL="https://$VITE_BACKEND_URL"
            export VITE_API_BASE_URL="$VITE_BACKEND_URL"
          fi
          echo "VITE_BACKEND_URL is set: $VITE_BACKEND_URL"
          npm run build

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
