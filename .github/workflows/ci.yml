# ==============================================================================
# AshaAI - Continuous Integration (CI)
#
# Required GitHub Secrets:
# - NONE: Runs automated build and test checks on code changes without secrets.
# ==============================================================================

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test

  ai-service:
    name: AI service syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q main.py
